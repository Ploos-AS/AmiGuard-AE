name: host-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host qualification
        id: qualify
        shell: bash
        run: |
          set -o pipefail
          {
            make clean
            make deps-ed25519
            make check
            make crypto-check
            bash tests/test_sign_manifest.sh
            make
            ./AmiGuardAE
          } 2>&1 | tee host-check.log
      - name: Upload qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-check-log
          path: host-check.log
